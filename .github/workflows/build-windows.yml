name: build-windows

# Build the pdf2png Windows installer + portable .exe on Windows runners
# and (optionally) attach them to a GitHub Release.
#
# Push to main            → only `build` job, uploads to the workflow's
#                           Artifacts tab (14-day retention, fine for testing).
# Push a tag like v0.1.0  → `build` runs, then `release` job downloads the
#                           artifact and creates a GitHub Release with both
#                           .exe files attached — a permanent download URL.
# Manual dispatch         → like push to main (artifact only).
# Pull request            → only `build` job, validates the pipeline.

on:
  push:
    branches: [main]
    # `branches: [main]` alone does NOT match tag pushes — GitHub
    # Actions only fires `push` for refs listed in `branches`. We
    # therefore also have to opt in to tag pushes here, otherwise
    # `git push origin v0.1.0` never triggers the release job.
    # We restrict the glob to semver-style `vX.Y.Z` so random tags
    # (e.g. `v0.1.0-rc1`) don't accidentally fire a release.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required so the release job can create releases + upload assets

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: meta
        # electron-builder hardcodes "${productName} Setup ${version}.${ext}"
        # and "${productName} ${version}.${ext}" for the NSIS + portable
        # artifacts. Reading the version here keeps the verify / upload /
        # release steps in sync with whatever is currently in package.json.
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm install` (not `npm ci`) so the postinstall hook copies
        # pdf.worker into public/ and npm materialises optional native
        # deps for the host platform.
        run: npm install

      - name: Pin sharp for win32-x64 + Electron
        # Required so sharp loads on the target Windows machine without
        # any extra install step. See scripts/pin-sharp-windows.mjs.
        run: npm run pin:sharp:win

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=dot

      - name: Compile Electron sources
        run: npm run build:electron

      - name: Build Windows installer (NSIS + portable)
        env:
          # Skip electron-builder's automatic code signing — no cert in CI.
          # The artifact will be unsigned and trigger SmartScreen on first
          # launch, which is the expected v1 behavior.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder 25 asks for a GitHub PAT whenever it detects
          # a CI environment, even when we're only producing a local
          # artifact. Belt-and-suspenders alongside `publish: null` in
          # electron-builder.yml.
          GH_TOKEN: ''
        run: npm run build:win

      - name: Verify artifacts exist
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -e
          echo "--- dist contents ---"
          ls -la dist/ | head -20
          echo
          echo "--- expected artifacts ---"
          # electron-builder's NsisTarget hardcodes these two names
          # (see NsisTarget.js:99). The portable one is
          # "${productName} ${version}.${ext}", the NSIS one is
          # "${productName} Setup ${version}.${ext}".
          for f in "PDF2PNG Editor ${VERSION}.exe" "PDF2PNG Editor Setup ${VERSION}.exe"; do
            if [ -f "dist/$f" ]; then
              echo "OK: dist/$f ($(du -h "dist/$f" | cut -f1))"
            else
              echo "MISSING: dist/$f"
              exit 1
            fi
          done

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf2png-windows-x64
          path: |
            dist/PDF2PNG Editor ${{ steps.meta.outputs.version }}.exe
            dist/PDF2PNG Editor Setup ${{ steps.meta.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    # Only run when a tag like v0.1.0 is pushed. `github.ref_name` in a
    # tags-only trigger is the bare tag (e.g. "v0.1.0"); we use that as
    # the release name.
    # The `&& needs.build.result == 'success'` clause is defensive: if
    # the build job fails (e.g. sharp pinning, electron-builder, lint,
    # tests) we must NOT publish an empty release — softprops silently
    # skips missing files by default and would otherwise create a
    # tag-only release with no assets.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: meta
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: pdf2png-windows-x64
          path: artifacts

      - name: List downloaded files
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PDF2PNG Editor ${{ steps.meta.outputs.version }}.exe
            artifacts/PDF2PNG Editor Setup ${{ steps.meta.outputs.version }}.exe
          # softprops defaults `fail_on_unmatched_files: false` — if
          # the glob doesn't match anything it silently creates the
          # release with no assets. Set to true so a path mismatch
          # (renamed artifact, wrong glob, etc.) fails the job loudly
          # instead of producing an empty release.
          fail_on_unmatched_files: true
          # Don't auto-publish as latest; mark as draft so the user can
          # review the body / changelog before the public sees it.
          draft: true
          generate_release_notes: true
          # The release title follows the tag (e.g. "v0.1.0").
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## pdf2png ${{ github.ref_name }}

            Windows 10/11 桌面应用（无需 Node，无需 npm）。

            - **PDF2PNG Editor Setup ${{ steps.meta.outputs.version }}.exe** — NSIS 安装器（写注册表、桌面快捷方式、开始菜单）
            - **PDF2PNG Editor ${{ steps.meta.outputs.version }}.exe** — 绿色单文件（双击即跑，不留痕迹）

            首次运行会触发 SmartScreen，点 "更多信息 → 仍要运行"。

            已知限制：未签名（SmartScreen 警告）、不支持 macOS/Linux、仅 x64 架构。
